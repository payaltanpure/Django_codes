<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>
<body>

<h1>Add Student</h1>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name">
    <br><br>

    <label>Age:</label>
    <input type="number" name="age">
    <br><br>

    <label>Course:</label>
    <input type="text" name="course">
    <br><br>

    <label>Marks:</label>
    <input type="number" step="0.01" name="marks">
    <br><br>

    <button type="submit">Add Student</button>
</form>

</body>
</html>
